[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-credit-forge"
version = "1.1.0"
description = "Quantum Credit Risk & Portfolio Optimization Engine — Enterprise Credit Risk Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "QuantumCreditForge Contributors"}
]
keywords = [
    "credit", "risk", "portfolio", "quantum", "basel", "vqe", "qaoa",
    "stress-testing", "pd", "lgd", "ead", "regulatory", "finance"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
]

[project.optional-dependencies]
quantum = ["pyqpanda3>=0.3.2"]
gui = ["customtkinter>=5.0.0"]
data = ["pandas>=2.0.0"]
optimize = ["optuna>=3.0.0"]
all = ["pyqpanda3>=0.3.2", "customtkinter>=5.0.0", "pandas>=2.0.0", "optuna>=3.0.0"]
dev = ["pytest>=7.0", "black", "ruff"]

[project.scripts]
quantum-credit-forge = "quantum_credit_forge.__main__:main"
qcf = "quantum_credit_forge.__main__:main"

[project.urls]
Homepage = "https://github.com/quantumcreditforge/QuantumCreditForge"
Documentation = "https://github.com/quantumcreditforge/QuantumCreditForge#readme"
Issues = "https://github.com/quantumcreditforge/QuantumCreditForge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantum_credit_forge = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
